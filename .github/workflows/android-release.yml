name: Android Release

on:
  push:
    tags:
      - 'android/v*'

jobs:
  build-and-publish:
    name: Build & Publish to Play Store
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the GitHub Release carrying the signed APK

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Parse version and track from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#android/v}"

          # Default to 'internal' track
          if [[ "$VERSION" == *"-production" ]]; then
            TRACK="production"
            VERSION_NAME="${VERSION%-production}"
          elif [[ "$VERSION" == *"-alpha" ]]; then
            TRACK="alpha"
            VERSION_NAME="${VERSION%-alpha}"
          elif [[ "$VERSION" == *"-beta" ]]; then
            TRACK="beta"
            VERSION_NAME="${VERSION%-beta}"
          else
            TRACK="internal"
            VERSION_NAME="$VERSION"
          fi

          echo "track=$TRACK"           >> $GITHUB_OUTPUT
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "▸ Version: $VERSION_NAME | Track: $TRACK"

      - name: Verify tag matches checked-in version
        # versionCode/versionName are plain literals in build.gradle.kts, bumped
        # by PR before tagging (F-Droid regexes the build file at the tagged
        # commit and cannot evaluate Gradle expressions — TIC-101). A tag pushed
        # without the version-bump PR landing first fails here, before any build.
        id: gradle_version
        run: |
          GRADLE_FILE=android/app/build.gradle.kts
          GRADLE_NAME=$(grep -oE 'versionName = "[^"]+"' "$GRADLE_FILE" | head -1 | cut -d'"' -f2)
          GRADLE_CODE=$(grep -oE 'versionCode = [0-9]+' "$GRADLE_FILE" | head -1 | grep -oE '[0-9]+')

          if [ -z "$GRADLE_NAME" ] || [ -z "$GRADLE_CODE" ]; then
            echo "::error::Could not extract literal versionName/versionCode from $GRADLE_FILE."
            exit 1
          fi
          if [ "$GRADLE_NAME" != "${{ steps.version.outputs.version_name }}" ]; then
            echo "::error::Tag says ${{ steps.version.outputs.version_name }} but $GRADLE_FILE says $GRADLE_NAME. Land the version-bump PR before tagging."
            exit 1
          fi

          echo "version_code=$GRADLE_CODE" >> $GITHUB_OUTPUT
          echo "▸ build.gradle.kts: versionName=$GRADLE_NAME versionCode=$GRADLE_CODE"

      - name: Validate checked-in release notes
        # Release notes are sourced from checked-in files:
        # android/app/src/main/play/release-notes/<locale>/<track>.txt
        # Tags select the version and track only; tag annotations are ignored.
        run: |
          TRACK="${{ steps.version.outputs.track }}"
          shopt -s nullglob
          FILES=(android/app/src/main/play/release-notes/*/"$TRACK".txt)

          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "▸ No checked-in release notes found for track '$TRACK'."
            exit 0
          fi

          for FILE in "${FILES[@]}"; do
            # Google Play caps release notes at 500 CHARACTERS per locale (not bytes).
            # Count characters in a UTF-8 locale so non-Latin scripts (Hindi, Arabic,
            # Hebrew, ...) — where one char is several bytes — aren't falsely rejected.
            CHARS=$(LC_ALL=C.UTF-8 wc -m < "$FILE" | tr -d ' ')
            echo "▸ $FILE ($CHARS chars)"
            # Fail before uploading so we do not publish an invalid release edit.
            if [ "$CHARS" -gt 500 ]; then
              echo "::error::$FILE exceeds Play's 500-character release notes limit ($CHARS chars)."
              exit 1
            fi
            echo "─── preview: $FILE ───"
            cat "$FILE"
            echo "─── end ───"
          done

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore

      - name: Write Play Store service account
        run: |
          echo '${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}' > android/app/play-service-account.json

      - name: Build & publish AAB
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew publishReleaseBundle \
            -PplayTrack=${{ steps.version.outputs.track }} \
            -Pandroid.injected.signing.store.file=$(pwd)/app/release.keystore \
            -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$KEY_PASSWORD

      - name: Build signed APK for GitHub Release
        # F-Droid's reproducible-build flow (Binaries: in fdroiddata) downloads
        # this APK and verifies their from-source build matches it byte-for-byte,
        # then publishes OUR dev-signed APK (TIC-101). The APK must come from the
        # same commit/toolchain as the tag. Signing config is inherited from the
        # env of the publish step via gradle properties, so re-pass them here.
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/app/release.keystore \
            -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$KEY_PASSWORD

      - name: Attach APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION_NAME="${{ steps.version.outputs.version_name }}"
          TRACK="${{ steps.version.outputs.track }}"
          APK="ticklr-v${VERSION_NAME}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$APK"

          PRERELEASE_FLAG=""
          if [ "$TRACK" != "production" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          NOTES_FILE="android/app/src/main/play/release-notes/en-US/${TRACK}.txt"
          if [ -f "$NOTES_FILE" ]; then
            NOTES_ARGS=(--notes-file "$NOTES_FILE")
          else
            NOTES_ARGS=(--notes "Android v${VERSION_NAME} (${TRACK})")
          fi

          gh release create "$TAG" "$APK" \
            --title "Android v${VERSION_NAME} (${TRACK})" \
            "${NOTES_ARGS[@]}" \
            --verify-tag $PRERELEASE_FLAG

      - name: Clean up secrets
        if: always()
        run: |
          rm -f android/app/release.keystore
          rm -f android/app/play-service-account.json

      - name: Summary
        run: |
          echo "### ✅ Android build shipped" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** ${{ steps.version.outputs.version_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build (versionCode):** ${{ steps.gradle_version.outputs.version_code }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Track:** ${{ steps.version.outputs.track }}" >> $GITHUB_STEP_SUMMARY
